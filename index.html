<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Promedio</title>
</head>
<body>
    <header>
        <h1 class="titulo-header">Promedia tus Notas</h1>
    </header>
    <main>
        <h2>Ingresa las notas:
        </h2>

        <form action="" class="formulario">
            <label for="nombre-curso">Alumno</label>
            <input type="text" id="nombre-alumno" placeholder="Nombre del Alumno">

            <label for="nombre-curso">Nombre del Curso</label>
            <input type="text" id="nombre-curso" placeholder="Nombre del Curso">

            <span>Agrega tus Notas</span>
            <div class="registro-notas">
                <input type="number" class="nota" placeholder="Nota">
                <input type="number" class="nota" placeholder="Nota">
            </div>
            <button id="addNota" type="button">Agregar Nota</button>
            <button id="promediar" type="button">Promediar</button>


            <div class="resumen-notas">
                <div class="resumen-info">
                    <span class="resumen-etiqueta">RESUMEN ACADÉMICO</span>

                    <h3 id="resultado-curso">Matemática</h3>
                    <p id="resultado-alumno">Alumno: Juan Pérez</p>

                    <div class="promedio-card">
                        <span>Promedio final</span>
                        <strong id="resultado-promedio">17.5</strong>
                    </div>
                </div>

                <div class="resumen-detalle">
                    <h4>Notas registradas</h4>

                    <div class="lista-notas" id="resultado-notas">
                        <div class="nota-item">
                            <span>Nota 1</span>
                            <strong>16</strong>
                        </div>

                        <div class="nota-item">
                            <span>Nota 2</span>
                            <strong>18</strong>
                        </div>

                        <div class="nota-item">
                            <span>Nota 3</span>
                            <strong>18.5</strong>
                        </div>
                    </div>
                </div>
            </div>


        </form>
    </main>

    <footer>

    </footer>

    <script src="app.js"></script>
</body>
</html>
