<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Promedio</title>
</head>
<body>
    <header>
        <h1 class="titulo-header">Promedia tus Notas</h1>
    </header>
    <main>
        <h2>Ingresa las notas:
        </h2>

        <form action="" class="formulario">
            <label for="nombre-curso">Alumno</label>
            <input type="text" id="nombre-alumno" placeholder="Nombre del Alumno">

            <label for="nombre-curso">Nombre del Curso</label>
            <input type="text" id="nombre-curso" placeholder="Nombre del Curso">

            <span>Agrega tus Notas</span>
            <div class="registro-notas">
                <input type="number" class="nota" placeholder="Nota">
                <input type="number" class="nota" placeholder="Nota">
            </div>
            <button id="addNota" type="button">Agregar Nota</button>
            <button id="promediar" type="button">Promediar</button>
            
        </form>
    </main>

    <footer>

    </footer>

    <script src="app.js"></script>
</body>
</html>
